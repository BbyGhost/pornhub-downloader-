<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VideoFlow 8 Pro</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;width:430px;min-height:610px;background:#06080c;color:#edf2f8;font:13px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{padding:14px}.shell{border:1px solid #202836;border-radius:22px;background:linear-gradient(145deg,#101620,#080b10);overflow:hidden;box-shadow:0 22px 70px #0009}.top{padding:16px 16px 13px;border-bottom:1px solid #1b222e}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:950;font-size:18px;background:linear-gradient(135deg,#775bff,#14baf5);box-shadow:0 9px 30px #4266ff55}.name{font-size:18px;font-weight:950;letter-spacing:-.3px}.sub{margin-top:2px;color:#78869b;font-size:8px;font-weight:850;letter-spacing:1.8px}.pro{margin-left:auto;padding:5px 8px;border:1px solid #2b3c55;border-radius:999px;color:#78d5ff;background:#0b1621;font-size:9px;font-weight:900}.body{padding:13px}.engine{padding:12px;border:1px solid #222b39;border-radius:15px;background:#0b1017}.line{display:flex;align-items:center;justify-content:space-between}.label{font-weight:850}.muted{color:#77859a;font-size:10px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#596575}.dot.on{background:#55e3a5;box-shadow:0 0 10px #55e3a588}.dot.off{background:#ff7185}.state{color:#9da9ba;font-size:10px;margin-top:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.stat{padding:8px 7px;border:1px solid #1d2633;border-radius:11px;background:#080d13}.stat b{display:block;font-size:14px}.stat span{color:#69778c;font-size:8px;text-transform:uppercase;letter-spacing:.8px}.update{margin-top:10px;padding:11px;border:1px solid #242e3c;border-radius:13px;background:#0a1017}.status{color:#aab5c5;line-height:1.4;font-size:11px;min-height:16px}.status.ok{color:#63e4ac}.status.new{color:#70caff}.status.err{color:#ff7c91}.btn{width:100%;height:38px;margin-top:9px;border:0;border-radius:10px;color:#fff;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#7358ff,#18b7f3);box-shadow:0 8px 22px #315cff25}.btn:disabled{opacity:.45;cursor:default}.section{margin:13px 1px 7px;color:#75839a;font-size:8px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.site{height:52px;display:flex;align-items:center;gap:7px;padding:7px;border:1px solid #1d2633;border-radius:10px;background:#080c12;color:#dfe7f1;text-decoration:none}.site:hover{border-color:#536bff;transform:translateY(-1px)}.site img,.fallback{width:23px;height:23px;border-radius:7px;object-fit:contain;flex:0 0 auto}.fallback{display:grid;place-items:center;background:linear-gradient(135deg,#7358ff,#18b7f3);font-size:10px;font-weight:900}.site span{font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.foot{padding:10px 0 2px;text-align:center;color:#4e5b6e;font-size:8px}
</style></head>
<body><div class="wrap"><div class="shell">
<div class="top"><div class="brand"><div class="logo">V</div><div><div class="name">VideoFlow</div><div class="sub">HIGH-PERFORMANCE MEDIA ENGINE</div></div><div class="pro">8 PRO</div></div></div>
<div class="body">
<div class="engine"><div class="line"><span class="label"><i id="dot" class="dot"></i>Engine</span><span id="engineText" class="muted">Connecting…</span></div><div id="engineDetail" class="state">Initializing native engine</div>

<div class="section">Supported sources</div><div id="sites" class="sites"></div>
<div class="foot">Persistent engine • Parallel ranges • FFmpeg fallback • Non-DRM media</div>
</div></div></div><script src="popup.js"></script></body></html>
