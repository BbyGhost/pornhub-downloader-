<!doctype html>
<html><head><meta charset="utf-8"><title>VideoFlow</title><style>
*{box-sizing:border-box}body{margin:0;width:330px;background:#0b0e13;color:#eef2f7;font:13px system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{padding:18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#7c5cff,#20aef5);display:grid;place-items:center;font-weight:900;font-size:18px}.name{font-weight:850;font-size:16px}.sub{font-size:9px;letter-spacing:1.4px;color:#7f8b9d;margin-top:2px}.card{margin-top:16px;padding:14px;border:1px solid #242b35;border-radius:14px;background:#11151b}.row{display:flex;justify-content:space-between;align-items:center}.label{font-weight:750}.version{color:#8b96a7;font-size:11px}.status{margin-top:10px;color:#aeb8c7;line-height:1.4}.btn{width:100%;margin-top:12px;height:40px;border:0;border-radius:10px;color:white;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#7c5cff,#20aef5)}.btn:disabled{opacity:.55;cursor:default}.ok{color:#5de1a2}.new{color:#7ec8ff}.err{color:#ff7f8f}.foot{margin-top:12px;text-align:center;color:#596474;font-size:10px}
 .sites{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.site{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid #242b35;border-radius:11px;background:#0d1117;color:#dce4ef;text-decoration:none;cursor:pointer;transition:.15s}.site:hover{border-color:#5965ff;transform:translateY(-1px);background:#141923}.site img{width:28px;height:28px;border-radius:7px}.site span{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88px}</style></head><body><div class="wrap"><div class="brand"><div class="logo">V</div><div><div class="name">VideoFlow</div><div class="sub">PREMIUM DOWNLOADER</div></div></div><div class="card"><div class="row"><span class="label">Software update</span><span class="version" id="version">v—</span></div><div class="status" id="status">Checking GitHub…</div><button class="btn" id="update" disabled>Check for updates</button><div class="card sites-card"><div class="row"><span class="label">Supported sites</span><span class="version">Click to open</span></div><div class="sites" id="sites"></div></div><div class="foot">Extension + FFmpeg bridge updater</div></div><script src="popup.js"></script></body></html>
