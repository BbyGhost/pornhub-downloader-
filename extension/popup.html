<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoFlow</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;width:380px;min-height:520px;background:#07090d;color:#eef3f9;font:13px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{padding:18px}.hero{padding:16px;border:1px solid #202734;border-radius:20px;background:linear-gradient(145deg,#10151f,#0a0d13);box-shadow:0 18px 50px #0008}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#7357ff,#18b8ff);display:grid;place-items:center;font-weight:950;font-size:20px;box-shadow:0 8px 28px #4560ff55}.name{font-size:18px;font-weight:900}.sub{margin-top:3px;color:#77849a;font-size:9px;font-weight:800;letter-spacing:1.6px}.badge{margin-left:auto;padding:6px 8px;border-radius:99px;background:#121a22;color:#7fe7bd;font-size:9px;font-weight:850}.card{margin-top:12px;padding:13px;border:1px solid #202734;border-radius:15px;background:#0d1219}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.label{font-weight:850}.version{color:#7f8ca0;font-size:11px}.status{margin-top:8px;color:#aeb9c8;line-height:1.45}.ok{color:#61e3aa}.new{color:#72c9ff}.err{color:#ff7f91}.btn{width:100%;margin-top:11px;height:42px;border:0;border-radius:12px;color:white;font-weight:850;cursor:pointer;background:linear-gradient(135deg,#7357ff,#18b8ff);box-shadow:0 8px 24px #315cff30}.btn:disabled{opacity:.5;cursor:default}.section-title{margin:15px 2px 8px;color:#7e8ba0;font-size:9px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.site{min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 3px;border:1px solid #202734;border-radius:12px;background:#0a0e14;color:#dfe7f1;text-decoration:none;transition:.15s}.site:hover{transform:translateY(-2px);border-color:#5366ff;background:#111823}.site img,.site-fallback{width:26px;height:26px;border-radius:8px;object-fit:contain}.site-fallback{display:grid;place-items:center;background:linear-gradient(135deg,#7357ff,#18b8ff);font-weight:900}.site span{font-size:9px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:94px}.health{margin-top:11px;text-align:center;font-size:10px;color:#758298}.health.ok{color:#61e3aa}.health.bad{color:#ff7f91}.tip{margin-top:12px;padding:10px 11px;border-radius:11px;background:#0a1017;color:#7f8ca0;font-size:10px;line-height:1.45}.foot{margin-top:11px;text-align:center;color:#4f5b6c;font-size:9px}</style></head><body><div class="wrap"><div class="hero"><div class="brand"><div class="logo">V</div><div><div class="name">VideoFlow</div><div class="sub">FAST MEDIA DOWNLOADER</div></div><div class="badge">READY</div></div><div class="card"><div class="row"><span class="label">System</span><span class="version" id="version">v—</span></div><div class="status" id="status">Checking for updates…</div><button class="btn" id="update" disabled>Checking…</button></div><div class="section-title">Supported sites</div><div class="sites" id="sites"></div><div class="health" id="health">● Checking system health…</div><div class="tip">Detects available non-DRM media sources and sends downloads through the local FFmpeg bridge.</div><div class="foot">Automatic updater • FFmpeg bridge • v7</div></div></div><script src="popup.js"></script></body></html>
